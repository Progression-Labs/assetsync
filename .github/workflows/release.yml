name: release

# Push a tag `v<version>` (the version in Cargo.toml and bindings/node/package.json) to build the
# addon and the CLI for each platform, test them, and publish:
#   - GitHub Packages' npm registry: `@progression-labs/assetsync` plus
#     `@progression-labs/assetsync-linux-x64-gnu` (macOS arm64 returns when the org has a runner),
#     with the workflow's own GITHUB_TOKEN (no secret to set up);
#   - a GitHub release with the CLI binaries and `assetsync-node-<version>-linux-x64-gnu.tgz`,
#     a self-contained npm tarball that installs from its URL with no registry or token.
# The crate is `publish = false`: zero takes it as a git dependency.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The tag, Cargo.toml and package.json agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          npm_version=$(jq -r .version bindings/node/package.json)
          echo "tag $tag, Cargo.toml $cargo_version, package.json $npm_version"
          test "$tag" = "$cargo_version"
          test "$tag" = "$npm_version"

  build:
    needs: check-version
    strategy:
      fail-fast: true
      matrix:
        include:
          # The oldest supported Ubuntu runner: the addon then needs only its glibc (2.35).
          - host: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@v2
      - name: Build the addon
        working-directory: bindings/node
        run: |
          bun install --frozen-lockfile
          bunx napi build --platform --release --target ${{ matrix.target }}
      - name: Test the addon
        working-directory: bindings/node
        run: bun test
      - name: Build the CLI
        run: |
          cargo build --release --locked --bin assetsync --target ${{ matrix.target }}
          tar -czf assetsync-${{ github.ref_name }}-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release assetsync
      - name: Pack a self-contained tarball of the addon
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        # The binary sits beside index.js, where the loader looks first, and the packed
        # package.json has no optionalDependencies or scripts: installing it from the release URL
        # touches no registry and needs no token.
        run: |
          version="${GITHUB_REF_NAME#v}"
          pack="$RUNNER_TEMP/pack"
          mkdir -p "$pack"
          cp bindings/node/index.js bindings/node/index.d.ts bindings/node/assetsync.linux-x64-gnu.node "$pack/"
          jq 'del(.optionalDependencies, .devDependencies, .scripts, .publishConfig)
              | .files += ["assetsync.linux-x64-gnu.node"]' bindings/node/package.json > "$pack/package.json"
          (cd "$pack" && npm pack --pack-destination "$GITHUB_WORKSPACE")
          mv "progression-labs-assetsync-$version.tgz" "assetsync-node-$version-linux-x64-gnu.tgz"
          tar tzvf "assetsync-node-$version-linux-x64-gnu.tgz"
      - name: Install the tarball into an empty project and load it
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          tgz="$PWD/assetsync-node-${GITHUB_REF_NAME#v}-linux-x64-gnu.tgz"
          app="$RUNNER_TEMP/consumer"
          mkdir -p "$app"
          cd "$app"
          echo '{"name":"consumer","private":true}' > package.json
          bun add "$tgz"
          cat > load.js <<'EOF'
          const a = require("@progression-labs/assetsync");
          const lock = a.parseLock("# k v\n");
          if (lock.header[0].key !== "k") throw new Error("parseLock gave the wrong header");
          console.log("loaded:", Object.keys(a).join(" "));
          EOF
          bun load.js
          node load.js
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: node-tgz
          path: assetsync-node-*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: bindings/node/*.node
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: assetsync-*.tar.gz
          if-no-files-found: error

  publish-npm:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@progression-labs"
      - uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          path: bindings/node/artifacts
      - name: Move the binaries into npm/<platform>
        working-directory: bindings/node
        run: |
          bun install --frozen-lockfile
          bunx napi artifacts
          ls -l npm/*/
      - name: Publish to GitHub Packages
        working-directory: bindings/node
        # prepublishOnly (`napi prepublish`) publishes each platform package and pins them as
        # optionalDependencies, then the main package goes. Every package.json carries
        # publishConfig.registry = https://npm.pkg.github.com, so nothing can go to npmjs.org.
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  github-release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: node-tgz
      - name: Release with the CLI binaries and the addon tarball
        run: |
          ls -l
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes \
            assetsync-*.tar.gz assetsync-node-*.tgz
        env:
          GH_TOKEN: ${{ github.token }}

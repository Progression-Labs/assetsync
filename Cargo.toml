[workspace]
members = [".", "bindings/node"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Progression Labs"]
repository = "https://github.com/Progression-Labs/assetsync"
rust-version = "1.88"

[workspace.lints.clippy]
dbg_macro = "warn"

[package]
name = "assetsync"
description = "Content-addressed asset sync: a sorted sha256 lock file, verified downloads from R2 or HTTP, a local hardlinked cache"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
exclude = [".github", "bindings"]
publish = false
keywords = ["assets", "content-addressed", "r2", "sync", "lockfile"]
categories = ["command-line-utilities", "filesystem"]

[features]
default = ["cli"]
# The `assetsync` binary. The Node bindings build the library without it.
cli = ["dep:clap"]

[dependencies]
anyhow = "1"
libc = "0.2"
rusty-s3 = "0.11"
serde_json = "1"
sha2 = "0.10"
ureq = "3"
clap = { version = "4.5", features = ["derive", "env"], optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "assetsync"
required-features = ["cli"]

[lints]
workspace = true

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
